#docker run --name ubuntu-sleep-container --entrypoint sleep2.0 ubuntu-sleeper 25
#FROM ubuntu
#ARG ["sleep"]
#CMD ["5"]

---
apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-sleep-pod
spec:
  containers:
  - name: ubuntu-sleep-pod
    image: ubuntu-sleeper
    command: ["sleep2.0"]
    args: ["25"]

---
apiVersion: v1 
kind: Pod 
metadata:
  name: ubuntu-sleeper-3 
spec:
  containers:
  - name: ubuntu
    image: ubuntu
    command:
      - sleep
      - "1200"

---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: webapp-green
  name: webapp-green
spec:
  containers:
  - image: kodekloud/webapp-color
    name: webapp-green
    args: ["--color=green"]          