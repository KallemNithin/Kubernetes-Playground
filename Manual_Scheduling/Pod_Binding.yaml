---

apiVersion: v1
kind: Pod
metadata:
  name: manual-pod
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
---
#@binding.yaml
apiVersion: v1
kind: Binding
metadata:
  name: manual-pod
target:
  apiVersion: v1
  kind: Node
  name: worker-node-1



